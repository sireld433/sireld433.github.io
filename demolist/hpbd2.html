<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc mừng sinh nhật!</title>
    <link rel="icon" type="image/favicon" href="/image/favicon.ico">
    <link rel="stylesheet" href="style/hpbd2.css">
</head>

<body>
    <main class="term">
        <div class="bar">~/demolist/sinhnhat.sh</div>
        <div class="screen">
            <pre id="log" aria-live="polite"></pre>

            <div id="cake-wrap" class="cake-wrap">
<pre class="cake" aria-label="Chiếc bánh sinh nhật"><span class="flame" id="flame">      )
     (</span>
      |
  .---+---.
  |~~~~~~~|
 .'-------'.
 |  &lt;3 &lt;3  |
 '---------'</pre>
                <button id="blow" type="button">Thổi nến</button>
            </div>

            <section id="wish" class="wish" hidden>
                <h1 id="title"></h1>
                <p id="message"></p>
                <p class="sign" id="sign"></p>
                <a class="back" href="/demo.html">&lt; quay lại demo</a>
            </section>
        </div>
    </main>

    <canvas id="confetti"></canvas>

    <script>
        const CONFIG = {
            name: "TÊN BẠN",
            from: "sireld433",
            message: "Chúc bạn tuổi mới thật nhiều sức khỏe, code không bug, " +
                     "và mọi dự định đều chạy một lần là xong. Cảm ơn vì đã là bạn của mình!"
        };
        // =========================

        const $ = id => document.getElementById(id);
        const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
        const sleep = ms => new Promise(r => setTimeout(r, ms));

        const intro = [
            `$ ./sinhnhat.sh --ten="${CONFIG.name}"`,
            "> đang tìm một người bạn tuyệt vời... đã thấy.",
            "> bánh đã sẵn sàng. Thổi nến thôi!"
        ];

        async function typeIntro() {
            const log = $("log");
            for (const line of intro) {
                for (const ch of line) {
                    log.textContent += ch;
                    if (!reduce) await sleep(24);
                }
                log.textContent += "\n";
                if (!reduce) await sleep(250);
            }
            $("cake-wrap").classList.add("show");
        }

        function confetti() {
            if (reduce) return;
            const c = $("confetti"), x = c.getContext("2d");
            c.width = innerWidth; c.height = innerHeight;
            const colors = ["#ff7eb6", "#ffc857", "#7be0c3", "#8fb4ff", "#ffffff"];
            const ps = Array.from({ length: 150 }, (_, i) => ({
                x: innerWidth / 2, y: innerHeight * 0.45,
                vx: (Math.random() - 0.5) * 14,
                vy: -Math.random() * 13 - 3,
                s: 5 + Math.random() * 5,
                r: Math.random() * 6,
                vr: (Math.random() - 0.5) * 0.3,
                c: colors[i % colors.length]
            }));
            let t = 0;
            (function frame() {
                x.clearRect(0, 0, c.width, c.height);
                t++;
                for (const p of ps) {
                    p.vy += 0.25; p.vx *= 0.99;
                    p.x += p.vx; p.y += p.vy; p.r += p.vr;
                    x.save();
                    x.globalAlpha = Math.max(0, 1 - t / 200);
                    x.translate(p.x, p.y);
                    x.rotate(p.r);
                    x.fillStyle = p.c;
                    x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
                    x.restore();
                }
                if (t < 200) requestAnimationFrame(frame);
                else x.clearRect(0, 0, c.width, c.height);
            })();
        }

        $("blow").addEventListener("click", () => {
            const flame = $("flame");
            flame.textContent = "      ~\n     ~";
            flame.classList.add("out");
            $("blow").hidden = true;
            $("title").textContent = `Chúc mừng sinh nhật, ${CONFIG.name}!`;
            $("message").textContent = CONFIG.message;
            $("sign").textContent = `- ${CONFIG.from}`;
            $("wish").hidden = false;
            confetti();
        });

        typeIntro();
    </script>
</body>

</html>
